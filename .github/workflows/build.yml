name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          set -euo pipefail

          echo "::group::Extraction du ZIP"
          ZIP="$(ls -1 *.zip 2>/dev/null | head -n1)"
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun .zip trouvé à la racine du repo"
            ls -la
            exit 1
          fi
          echo "ZIP = $ZIP"
          mkdir -p _src
          unzip -o "$ZIP" -d _src
          GRADLEW="$(find _src -name gradlew -type f | head -n1)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew introuvable"
            find _src -type f | head -30
            exit 1
          fi
          PROJ="$(cd "$(dirname "$GRADLEW")" && pwd)"
          echo "Projet trouvé : $PROJ"
          ls -la "$PROJ/"
          echo "::endgroup::"

          echo "::group::SDK Android"
          echo "ANDROID_HOME = $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          echo "::endgroup::"

          echo "::group::Compilation Gradle"
          cd "$PROJ"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-output.txt"
          echo "::endgroup::"

      - name: Résumé des erreurs
        if: failure()
        run: |
          {
            echo "## Erreurs de compilation"
            echo '```'
            if [ -f build-output.txt ]; then
              tail -200 build-output.txt
            else
              echo "La compilation Gradle n'a pas démarré."
              echo "Consultez les logs de l'étape Build ci-dessus."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
          if-no-files-found: ignore

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
