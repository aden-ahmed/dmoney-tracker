name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          ZIP="$(ls -1 *.zip | head -n1)"
          echo "ZIP = $ZIP"
          mkdir -p _src
          unzip -o -q "$ZIP" -d _src
          PROJ="$(dirname "$(find _src -name gradlew | head -n1)")"
          echo "PROJ = $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Compiler l'APK
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-output.txt"
          echo "BUILD_OK=true" >> "$GITHUB_ENV"

      - name: Résumé des erreurs (visible sur la page)
        if: failure()
        run: |
          {
            echo "## ❌ Erreurs de compilation"
            echo ""
            echo '```'
            tail -200 "$GITHUB_WORKSPACE/build-output.txt" 2>/dev/null || echo "Pas de fichier build-output.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le texte complet du build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
          if-no-files-found: ignore

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
